name: Build Wheels

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # native builds: Linux x86_64 and aarch64, macOS arm64 and x86_64,
        # Windows x86_64 and ARM64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel,
             windows-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # configured in pyproject.toml [tool.cibuildwheel]: each wheel is
      # installed and tested
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.2

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      # install from the sdist in a clean venv: its version must not be 0.0.0
      - name: Test the sdist
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.tar.gz pytest
          version=$("$RUNNER_TEMP/venv/bin/python" -c "import scatter_smooth; print(scatter_smooth.__version__)")
          echo "built version: $version"
          case "$version" in 0.0.0*|0+unknown) echo "bad version"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/run" && cp -R tests "$RUNNER_TEMP/run/"
          cd "$RUNNER_TEMP/run" && "$RUNNER_TEMP/venv/bin/python" -m pytest tests -q

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # trusted publishing: needs a trusted publisher for this workflow on PyPI
  # and a 'pypi' environment in the repository settings
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scatter-smooth
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
