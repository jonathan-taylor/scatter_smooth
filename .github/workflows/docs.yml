# Builds the docs (Jupyter Book 2, notebooks executed) from the branch it is
# run on and deploys them to GitHub Pages. The github-pages environment allows
# deploys from main only, so run it on main (after a release, say).

name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; don't cancel one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs the tags for the version
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Jupyter Book 2 (mystmd) runs on Node
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # R for the comparisons (rpy2, and R's microbenchmark), then the package
      # and the doc requirements, once
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-microbenchmark
          python -m pip install --upgrade pip
          pip install ".[doc]"

      # BASE_URL: the site is served from https://<owner>.github.io/scatter_smooth/
      - name: Build
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: |
          cd docs
          jupyter-book build --html --execute --ci
          test -f _build/html/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write    # to deploy to Pages
      id-token: write # to verify the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
