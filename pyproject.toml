[project]
name = "scatter_smooth"
dynamic = ["version"]
authors = [
  {name="Jonathan Taylor", email="jonathan.taylor@stanford.edu"},
]
description = "Smoothing splines and LOESS scatterplot smoothers with a C++ (Eigen) core, compatible with R's smooth.spline and loess"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["statistical learning", "spline", "smoothing", "non-parametric", "loess"]
license = "BSD-3-Clause"
license-files = ["LICENSE", "src/eigen/COPYING.MPL2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy",
    "scipy"
]

[project.urls]
Homepage = "https://github.com/jonathan-taylor/scatter_smooth"
Documentation = "https://jonathan-taylor.github.io/scatter_smooth/"
Issues = "https://github.com/jonathan-taylor/scatter_smooth/issues"

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "pytest",
    "ninja",
    "meson",
    "meson-python>=0.18",
    "pybind11",
    "setuptools_scm>=8",
]
doc = [
    # the docs (docs/myst.yml); bundles the Jupyter server and kernel
    "jupyter-book>=2,<3",
    "pandas",
    "matplotlib",
    "rpy2"
]

[build-system]
# meson-python >= 0.18 for the PEP 639 license fields
requires = ["meson-python>=0.18", "pybind11", "ninja", "patchelf; platform_system == 'Linux'", "setuptools_scm>=8"]
build-backend = "mesonpy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# each wheel is installed and tested (from a temporary directory)
test-requires = ["pytest"]
test-command = "python -m pytest {project}/tests -x -q"
# no free-threaded builds (the extension holds mutable fit state and doesn't
# declare itself GIL-free), no 32-bit builds (no numpy/scipy wheels), and
# no Python 3.10 on Windows ARM64 (numpy and scipy have wheels from 3.11)
skip = ["cp3??t-*", "*-win32", "*-manylinux_i686", "*-musllinux_i686", "cp310-win_arm64"]

[tool.cibuildwheel.windows]
# build with MSVC: meson may otherwise pick a MinGW gcc on the PATH (which
# can't link against an ARM64 Python, and whose runtime DLLs aren't shipped)
config-settings = {setup-args = "--vsenv"}